[package]
name = "rvgsrust-xlsxwriter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for rust_xlsxwriter - feature-complete XLSX writing"
repository = "https://github.com/Godse4ever/rvgsrust-xlsxwriter"

[lib]
name = "rvgsrust_xlsxwriter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
# Pinned to 0.75 deliberately -- confirmed, via an actual attempted
# bump in this sandbox (not just dependency-resolution guesswork), that
# every version from 0.76 through 0.95 is unbuildable here:
#
# - 0.76-0.86 all require `zip ^2.5`, which no currently-published zip
#   release satisfies (cargo build fails dependency resolution
#   outright).
# - 0.93-0.95 require `zip = "7.2"` specifically, and zip 7.2.0's own
#   MSRV is rustc 1.83 (confirmed via rustpy-xlsxwriter's own Cargo.lock,
#   which resolves to that exact zip version).
# - 0.87-0.92 require an older zip line (^3.0/^4.0) that *does* resolve
#   with enough transitive pinning (indexmap, half, getrandom -- three
#   separate major-version lines of it turned out to be in the graph
#   simultaneously) -- dependency resolution actually succeeds here.
#   But compilation itself then fails with a hard error (E0716,
#   "temporary value dropped while borrowed") in rust_xlsxwriter's own
#   worksheet.rs (a `&utility::column_number_to_name(col_num)` pattern
#   in a temporary-lifetime position), present in every 0.87-0.95
#   version checked. This is NOT a dependency-pinning problem -- it's
#   the crate's own source requiring a newer rustc than this sandbox's
#   1.75 provides, full stop, independent of the zip issues above.
#
# None of this is a problem with THIS project's code. On a machine with
# a current Rust toolchain (rustc 1.83+, which resolves all three
# issues above simultaneously), bumping straight to 0.95 with
# features = ["constant_memory", "zlib"] should work with NO src/lib.rs
# changes required: every write_x_with_format/merge_range/ExcelDateTime/
# DocProperties/Image/FormatAlign signature this project actually calls
# was diffed directly against 0.95's source and is byte-identical to
# 0.75's. (constant_memory itself needs one more thing beyond the
# version bump though -- see the note further down.) Also worth trying:
# the "zmij" feature (a faster zip/deflate backend rustpy-xlsxwriter
# also uses) and rust_xlsxwriter's own "polars" feature (dep:polars --
# native Polars integration built into the crate itself, a possible
# alternative or complement to this project's own hand-rolled Arrow
# path in write_dataframe()).
rust_xlsxwriter = { version = "0.75", features = ["zlib"] }
# IMPORTANT if you do bump and add the "constant_memory" feature: it is
# NOT automatic just by enabling the Cargo feature. It requires calling
# a *different* constructor -- Workbook::add_worksheet_with_constant_memory()
# instead of add_worksheet() -- to opt in per-worksheet (confirmed from
# 0.95's source). Getting the actual performance benefit means adding a
# new code path in src/lib.rs's Workbook::add_worksheet() (e.g. a
# `constant_memory: bool` parameter), not just flipping the feature on.
# It also comes with usage restrictions on that worksheet (rows must be
# written in strictly increasing order, which write_records()/
# write_dataframe() already do -- but check the crate's own
# "restrictions when using constant memory mode" docs for the rest
# before wiring it up).

# Native Arrow zero-copy DataFrame support (write_dataframe()). Reads
# via the Arrow PyCapsule Interface (__arrow_c_stream__), so no per-cell
# Python object extraction is needed for pyarrow.Table, pandas.DataFrame
# (2.x+), or polars.DataFrame (via .to_arrow()). Deliberately NOT using
# arrow's own `pyarrow` cargo feature (which would pull in `pyo3 ^0.23`
# and conflict with the pyo3 0.22 pinned above, the same trap
# `pyo3-arrow` was in) -- instead this reads the PyCapsule ourselves via
# pyo3 0.22's own PyCapsule type and arrow's plain (non-pyo3) `ffi`
# feature. See src/lib.rs's record_batches_from_arrow() for the
# capsule-ownership handling, and the Roadmap in README.md for which
# Arrow types are and aren't supported yet (currently: int64, float64,
# string/utf8, large_utf8, bool).
arrow = { version = "54.0", features = ["ffi"] }
# Transitive pins, both required only by this sandbox's old (apt-
# installed, 1.75) cargo -- newer indexmap/half releases need Cargo
# features or a rustc version this toolchain doesn't have. Likely
# removable on a machine with a current Rust toolchain.
#
# Toolchain note: in this same sandbox, `cargo check`/`cargo build`
# work fine with these two pins, but `cargo metadata` (which maturin
# calls internally) additionally resolves dependencies for every target
# platform up front -- including wasm32 -- and hits a *third* crate
# (wit-bindgen, pulled in transitively for wasm targets this project
# never builds for) with the same edition2024 requirement, with no
# amount of pinning able to satisfy it here. Built successfully instead
# via `cargo build --release` directly + manually placing the resulting
# .so, bypassing maturin's metadata step. This is specific to this
# sandbox's outdated apt-installed cargo (1.75) -- the CI workflow in
# .github/workflows/CI.yml uses dtolnay/rust-toolchain@stable, i.e. a
# current Rust toolchain, so `maturin develop`/`build` should work
# there without any of this.
indexmap = "=2.6.0"
half = "=2.4.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
