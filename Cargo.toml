[package]
name = "rvgsrust-xlsxwriter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for rust_xlsxwriter - feature-complete XLSX writing"
repository = "https://github.com/Godse4ever/rvgsrust-xlsxwriter"

[lib]
name = "rvgsrust_xlsxwriter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }

# rust_xlsxwriter 0.96 with optimized backends
# Features:
# - zlib: compression support
# - zmij: ~10% faster numeric-write backend (drop-in replacement)
# Built on official rust_xlsxwriter crate trusted by Python xlsxwriter
rust_xlsxwriter = { version = "0.96", features = ["zlib", "zmij"] }

# Native Arrow zero-copy DataFrame support
# Reads via Arrow PyCapsule Interface without per-cell Python object extraction
# Supports: pyarrow.Table, pandas.DataFrame (2.x+), polars.DataFrame
arrow = { version = "54.0", features = ["ffi"] }

[profile.release]
# Aggressive optimization for maximum performance
lto = true
codegen-units = 1
opt-level = 3
strip = true
panic = "abort"  # Reduce binary size, faster panics
