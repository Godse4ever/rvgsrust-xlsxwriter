[package]
name = "rvgsrust-xlsxwriter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for rust_xlsxwriter - feature-complete XLSX writing"
repository = "https://github.com/Godse4ever/rvgsrust-xlsxwriter"

[lib]
name = "rvgsrust_xlsxwriter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
# Pinned to 0.75 deliberately. rust_xlsxwriter 0.76-0.86 all require
# `zip ^2.5`, which no currently-published zip release satisfies, so
# `cargo build` fails dependency resolution outright on any of those.
# Confirmed this is fixed upstream by 0.95.0 (resolves to zip 7.2.0,
# per rustpy-xlsxwriter's own Cargo.lock, which uses that exact
# combination) -- but 0.95's dependency tree pulls in transitive
# crates (getrandom, tempfile, rustix, etc.) whose Cargo.toml manifests
# require the `edition2024` Cargo feature, unsupported by the Rust
# 1.75 toolchain available in this sandbox (no network path here to
# rustup.rs to get a newer one). On a machine with a current Rust
# toolchain (1.85+), bumping straight to 0.95 with
# features = ["constant_memory", "zmij", "zlib"] should work and is
# worth trying -- constant_memory in particular is likely to help
# performance on large sheets, and is what rustpy-xlsxwriter itself
# uses.
# Some worksheet method signatures changed between 0.75 and later
# releases (e.g. write_string/write_number/write_boolean gained
# `_with_format` counterparts instead of an Option<&Format> parameter),
# so re-check src/lib.rs against whatever version you land on.
rust_xlsxwriter = { version = "0.75", features = ["zlib"] }

# Native Arrow zero-copy DataFrame support (write_dataframe()). Reads
# via the Arrow PyCapsule Interface (__arrow_c_stream__), so no per-cell
# Python object extraction is needed for pyarrow.Table, pandas.DataFrame
# (2.x+), or polars.DataFrame (via .to_arrow()). Deliberately NOT using
# arrow's own `pyarrow` cargo feature (which would pull in `pyo3 ^0.23`
# and conflict with the pyo3 0.22 pinned above, the same trap
# `pyo3-arrow` was in) -- instead this reads the PyCapsule ourselves via
# pyo3 0.22's own PyCapsule type and arrow's plain (non-pyo3) `ffi`
# feature. See src/lib.rs's record_batches_from_arrow() for the
# capsule-ownership handling, and the Roadmap in README.md for which
# Arrow types are and aren't supported yet (currently: int64, float64,
# string/utf8, large_utf8, bool).
arrow = { version = "54.0", features = ["ffi"] }
# Transitive pins, both required only by this sandbox's old (apt-
# installed, 1.75) cargo -- newer indexmap/half releases need Cargo
# features or a rustc version this toolchain doesn't have. Likely
# removable on a machine with a current Rust toolchain.
#
# Toolchain note: in this same sandbox, `cargo check`/`cargo build`
# work fine with these two pins, but `cargo metadata` (which maturin
# calls internally) additionally resolves dependencies for every target
# platform up front -- including wasm32 -- and hits a *third* crate
# (wit-bindgen, pulled in transitively for wasm targets this project
# never builds for) with the same edition2024 requirement, with no
# amount of pinning able to satisfy it here. Built successfully instead
# via `cargo build --release` directly + manually placing the resulting
# .so, bypassing maturin's metadata step. This is specific to this
# sandbox's outdated apt-installed cargo (1.75) -- the CI workflow in
# .github/workflows/CI.yml uses dtolnay/rust-toolchain@stable, i.e. a
# current Rust toolchain, so `maturin develop`/`build` should work
# there without any of this.
indexmap = "=2.6.0"
half = "=2.4.1"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
