[package]
name = "rvgsrust-xlsxwriter"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Python bindings for rust_xlsxwriter - feature-complete XLSX writing"
repository = "https://github.com/Godse4ever/rvgsrust-xlsxwriter"

[lib]
name = "rvgsrust_xlsxwriter"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.22", features = ["extension-module", "abi3-py38"] }
# Pinned to 0.75 deliberately. rust_xlsxwriter 0.76-0.86 all require
# `zip ^2.5`, which no currently-published zip release satisfies, so
# `cargo build` fails dependency resolution outright on any of those.
# Confirmed this is fixed upstream by 0.95.0 (resolves to zip 7.2.0,
# per rustpy-xlsxwriter's own Cargo.lock, which uses that exact
# combination) -- but 0.95's dependency tree pulls in transitive
# crates (getrandom, tempfile, rustix, etc.) whose Cargo.toml manifests
# require the `edition2024` Cargo feature, unsupported by the Rust
# 1.75 toolchain available in this sandbox (no network path here to
# rustup.rs to get a newer one). On a machine with a current Rust
# toolchain (1.85+), bumping straight to 0.95 with
# features = ["constant_memory", "zmij", "zlib"] should work and is
# worth trying -- constant_memory in particular is likely to help
# performance on large sheets, and is what rustpy-xlsxwriter itself
# uses.
# Some worksheet method signatures changed between 0.75 and later
# releases (e.g. write_string/write_number/write_boolean gained
# `_with_format` counterparts instead of an Option<&Format> parameter),
# so re-check src/lib.rs against whatever version you land on.
rust_xlsxwriter = { version = "0.75", features = ["zlib"] }
# NOTE: native Arrow-based zero-copy DataFrame writing is planned (see
# python/rvgsrust_xlsxwriter/dataframe.py) but not implemented yet -- the
# `arrow`/`pyo3-arrow` deps were declared but never referenced from src/,
# and pyo3-arrow 0.8's pyo3 ^0.24 requirement conflicts with the pyo3 0.22
# pinned below (cargo refuses to link two `pyo3-ffi` versions at once).
# Re-add both once this crate is upgraded to pyo3 0.24+, or once a
# pyo3-arrow release compatible with pyo3 0.22 is available.

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
