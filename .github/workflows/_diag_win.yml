# TEMPORARY. Windows-only pytest capture: Actions raw logs live on a blob
# host unreachable from the environment doing this work, so the output is
# routed through a PR comment instead. Deleted once the failure is fixed.
name: diag-win

on:
  push:
    branches: [ 'audit/**' ]

jobs:
  diag-win:
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - uses: dtolnay/rust-toolchain@stable

    - name: Install
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest openpyxl pyarrow pandas polars
        python -m pip install .

    - name: Pytest
      shell: bash
      run: |
        set +e
        pytest tests/ -q -rf --no-header > pytest.txt 2>&1
        echo "pytest_exit=$?" > exit.txt
        tail -c 20000 pytest.txt > pyt.txt

    - name: Post to PR
      shell: bash
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        {
          echo '## Windows pytest'
          echo '```'; cat exit.txt; echo '```'
          echo '```'; cat pyt.txt; echo '```'
        } > body.md
        gh pr comment 8 --body-file body.md --repo "$GITHUB_REPOSITORY"
