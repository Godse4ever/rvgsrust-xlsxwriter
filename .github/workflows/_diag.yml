# TEMPORARY diagnostic workflow. Captures clippy and MSRV compiler output
# and posts it to the PR, because raw Actions logs are served from a blob
# host that is not reachable from the environment doing this work.
# This file is deleted before the branch is merged.
name: diag

on:
  push:
    branches: [ 'audit/**' ]

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
    - uses: actions/checkout@v4

    - name: Rust stable + clippy
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Capture clippy
      run: |
        set +e
        cargo clippy --all-targets -- -D warnings \
          -A clippy::useless_conversion \
          -A clippy::too_many_arguments \
          -A clippy::new_without_default > clippy_raw.txt 2>&1
        echo "exit=$?" > clippy_exit.txt
        tail -c 30000 clippy_raw.txt > clippy.txt
        wc -c clippy_raw.txt clippy.txt

    - name: Capture rustfmt
      run: |
        set +e
        cargo fmt --check > fmt_raw.txt 2>&1
        echo "exit=$?" >> clippy_exit.txt
        tail -c 12000 fmt_raw.txt > fmt.txt

    - name: Rust 1.85 (declared MSRV)
      uses: dtolnay/rust-toolchain@1.85.0

    - name: Capture MSRV check
      run: |
        set +e
        cargo check > msrv_raw.txt 2>&1
        echo "msrv_exit=$?" >> clippy_exit.txt
        tail -c 20000 msrv_raw.txt > msrv.txt
        wc -c msrv_raw.txt msrv.txt

    - name: Post diagnostics to PR
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        {
          echo '## Diagnostics for `'"$GITHUB_SHA"'`'
          echo
          echo '### exit codes'
          echo '```'; cat clippy_exit.txt; echo '```'
          echo '### clippy'
          echo '```'; cat clippy.txt; echo '```'
          echo '### rustfmt'
          echo '```'; cat fmt.txt; echo '```'
          echo '### cargo check @ 1.85'
          echo '```'; cat msrv.txt; echo '```'
        } > body.md
        gh pr comment 8 --body-file body.md --repo "$GITHUB_REPOSITORY"
