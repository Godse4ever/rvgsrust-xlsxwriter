name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        pip install maturin pytest

    - name: Build and install
      run: |
        maturin develop --release

    - name: Run tests
      run: |
        pytest tests/ -v

  # This crate builds against pyo3's stable ABI (abi3-py38, see
  # Cargo.toml), which means a single wheel per OS/architecture works
  # across Python 3.8-3.12 -- there is no need to rebuild once per
  # Python version like a non-abi3 extension would.
  #
  # Linux wheels are built inside a manylinux_2_17 container via
  # maturin-action so the resulting .whl is manylinux-compliant
  # (avoids GLIBC_2.18+ symbol errors that occur when building
  # directly on ubuntu-latest).  Windows and macOS build normally.
  build-wheels-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build manylinux wheel
      uses: PyO3/maturin-action@v1
      with:
        manylinux: manylinux_2_17
        args: --release --out dist
        rust-toolchain: stable

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-ubuntu-latest
        path: dist/*.whl

  build-wheels-non-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build wheel
      run: maturin build --release

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: target/wheels/*.whl

  publish:
    needs: [test, build-wheels-linux, build-wheels-non-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    - name: Install twine
      run: pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*.whl --skip-existing
