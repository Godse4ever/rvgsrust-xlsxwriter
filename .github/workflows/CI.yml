name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Lint runs once on Linux rather than once per matrix entry: clippy and
  # rustfmt results do not vary by OS or Python version, so repeating them
  # would only burn runner minutes.
  #
  # -D warnings promotes all clippy warnings to errors. The three -A flags
  # come AFTER -D warnings so they take precedence for those specific lints
  # (rustc processes lint flags left-to-right, later wins). The
  # [lints.clippy] table in Cargo.toml already sets these to allow, but
  # -D warnings is a broader group flag that would otherwise override the
  # table's specific allows -- passing them again here as explicit -A flags
  # guarantees the allows win regardless of flag ordering with Cargo. See
  # Cargo.toml for the rationale on each suppressed lint.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Lint (clippy)
      shell: bash
      run: |
        set +e
        cargo clippy --all-targets -- -D warnings \
          -A clippy::useless_conversion \
          -A clippy::too_many_arguments \
          -A clippy::new_without_default > clippy_output.log 2>&1
        code=$?
        set -e
        cat clippy_output.log
        if [ "$code" != "0" ]; then
          grep -a -E "^error|-->" clippy_output.log | head -n 40 | while IFS= read -r line; do
            line="${line//$'\r'/}"
            if [ -n "$line" ]; then
              echo "::error::${line//$'%'/%25}"
            fi
          done
        fi
        exit $code

    - name: Format check
      run: cargo fmt --check

  # Wheels ship for Linux, macOS and Windows, but the suite previously ran
  # only on Linux/3.11 -- so nothing verified the library actually worked on
  # the other two platforms, or on any Python version other than 3.11.
  #
  # Installs with `pip install .` rather than `maturin develop` so a single
  # command works on all three runners: maturin develop needs an activated
  # virtualenv, and activation differs on Windows (Scripts\activate vs
  # bin/activate). maturin is the PEP 517 backend, so `pip install .` builds
  # the release extension anyway.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms when one fails: a platform-specific
      # failure is exactly what this matrix exists to surface, and knowing
      # whether it is one platform or all of them is the useful signal.
      fail-fast: false
      matrix:
        include:
          # Oldest and newest supported Python, plus a mid version.
          - { os: ubuntu-latest,  python: '3.9'  }
          - { os: ubuntu-latest,  python: '3.12' }
          - { os: ubuntu-latest,  python: '3.13' }
          # One Python per remaining OS: platform coverage is the point here,
          # and version coverage is already handled above.
          - { os: macos-latest,   python: '3.12' }
          - { os: windows-latest, python: '3.12' }
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest openpyxl pyarrow pandas polars
        python -m pip install .

    - name: Run tests
      run: pytest tests/ -v

  # This crate builds against pyo3's stable ABI (abi3-py38, see
  # Cargo.toml), which means a single wheel per OS/architecture works
  # across Python 3.8-3.12 -- there is no need to rebuild once per
  # Python version like a non-abi3 extension would.
  #
  # Linux wheels are built inside a manylinux_2_17 container via
  # maturin-action so the resulting .whl is manylinux-compliant
  # (avoids GLIBC_2.18+ symbol errors that occur when building
  # directly on ubuntu-latest).  Windows and macOS build normally.
  #
  # This job verifies Cargo.toml's declared rust-version is real,
  # rather than trusting it -- a dependency bump (this project's own,
  # or an upstream crate's) can silently raise the true floor. The
  # toolchain version is read from Cargo.toml at run time instead of
  # hardcoded here, because the hardcoded version drifted out of sync
  # with the declared rust-version twice before this: once during the
  # 1.83->1.85 bump, and again during 1.85->1.88 (rust_xlsxwriter
  # 0.97.0's zip dependency bump) -- both times this job kept testing
  # an old, already-superseded floor instead of the current one, which
  # defeats the point of having it. Reading the value dynamically means
  # the next version bump can't silently do the same thing a third time.
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Read declared MSRV from Cargo.toml
      id: msrv
      run: |
        version=$(grep -m1 '^rust-version' Cargo.toml | sed -E 's/.*"([0-9.]+)".*/\1/')
        echo "version=$version" >> "$GITHUB_OUTPUT"
    - uses: dtolnay/rust-toolchain@master
      with:
        toolchain: ${{ steps.msrv.outputs.version }}
    - name: Check against declared MSRV
      run: cargo check --locked || cargo check

  build-wheels-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build manylinux wheel
      uses: PyO3/maturin-action@v1
      with:
        manylinux: manylinux_2_17
        args: --release --out dist
        rust-toolchain: stable

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-ubuntu-latest
        path: dist/*.whl

  build-wheels-non-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build wheel
      run: maturin build --release

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: target/wheels/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: wheels-sdist
        path: dist/*.tar.gz

  # Publishing uses PyPI Trusted Publishing (OIDC) rather than a long-lived
  # API token. The previous version ran `twine upload` with
  # secrets.PYPI_API_TOKEN, but no such secret was ever configured on this
  # repository -- which is why the v0.2.0 tag build failed at this step and
  # nothing was ever actually published.
  #
  # Trusted Publishing removes the credential entirely: PyPI verifies a
  # short-lived OIDC token minted by GitHub for this specific repository and
  # workflow, so there is no secret to leak, rotate or accidentally paste
  # anywhere. Setup is one form on PyPI (see RELEASING.md) and no secret is
  # added to this repo.
  publish:
    needs: [lint, test, msrv, build-wheels-linux, build-wheels-non-linux, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      # Required for Trusted Publishing: lets the job mint the OIDC token
      # PyPI checks. Nothing else in the workflow needs it.
      id-token: write
    steps:
    - uses: actions/checkout@v4

    - name: Download all wheels and the sdist
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    # A PyPI version number can never be reused, even after deletion, so a
    # tag that disagrees with the packaged version would burn it permanently.
    # This project has already shipped a release where the three version
    # declarations disagreed with each other, so all three are checked
    # against the tag before anything is uploaded.
    - name: Verify tag matches every declared version
      run: |
        set -euo pipefail
        tag="${GITHUB_REF_NAME#v}"
        pyproject=$(grep -m1 '^version = ' pyproject.toml | cut -d'"' -f2)
        cargo=$(grep -m1 '^version = ' Cargo.toml | cut -d'"' -f2)
        init=$(grep -m1 '^__version__ = ' python/rvgsrust_xlsxwriter/__init__.py | cut -d'"' -f2)
        echo "tag=$tag pyproject=$pyproject cargo=$cargo __init__=$init"
        for name in pyproject cargo init; do
          eval "value=\$$name"
          if [ "$value" != "$tag" ]; then
            echo "::error::$name declares '$value' but the tag is '$tag'"
            exit 1
          fi
        done

    - name: Check the artifacts exist
      run: |
        ls -l dist/
        test -n "$(find dist -name '*.whl' -print -quit)"
        test -n "$(find dist -name '*.tar.gz' -print -quit)"

    - name: Publish to PyPI
      uses: pypa/gh-action-pypi-publish@release/v1
