name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  # Lint runs once on Linux rather than once per matrix entry: clippy and
  # rustfmt results do not vary by OS or Python version, so repeating them
  # would only burn runner minutes.
  #
  # -D warnings promotes all clippy warnings to errors. The three -A flags
  # come AFTER -D warnings so they take precedence for those specific lints
  # (rustc processes lint flags left-to-right, later wins). The
  # [lints.clippy] table in Cargo.toml already sets these to allow, but
  # -D warnings is a broader group flag that would otherwise override the
  # table's specific allows -- passing them again here as explicit -A flags
  # guarantees the allows win regardless of flag ordering with Cargo. See
  # Cargo.toml for the rationale on each suppressed lint.
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt

    - name: Lint (clippy)
      run: |
        cargo clippy --all-targets -- -D warnings \
          -A clippy::useless_conversion \
          -A clippy::too_many_arguments \
          -A clippy::new_without_default

    - name: Format check
      run: cargo fmt --check

  # Wheels ship for Linux, macOS and Windows, but the suite previously ran
  # only on Linux/3.11 -- so nothing verified the library actually worked on
  # the other two platforms, or on any Python version other than 3.11.
  #
  # Installs with `pip install .` rather than `maturin develop` so a single
  # command works on all three runners: maturin develop needs an activated
  # virtualenv, and activation differs on Windows (Scripts\activate vs
  # bin/activate). maturin is the PEP 517 backend, so `pip install .` builds
  # the release extension anyway.
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      # Do not cancel the other platforms when one fails: a platform-specific
      # failure is exactly what this matrix exists to surface, and knowing
      # whether it is one platform or all of them is the useful signal.
      fail-fast: false
      matrix:
        include:
          # Oldest and newest supported Python, plus a mid version.
          - { os: ubuntu-latest,  python: '3.9'  }
          - { os: ubuntu-latest,  python: '3.12' }
          - { os: ubuntu-latest,  python: '3.13' }
          # One Python per remaining OS: platform coverage is the point here,
          # and version coverage is already handled above.
          - { os: macos-latest,   python: '3.12' }
          - { os: windows-latest, python: '3.12' }
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install package and test dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install pytest openpyxl pyarrow pandas polars
        python -m pip install .

    - name: Run tests
      run: pytest tests/ -v

  # This crate builds against pyo3's stable ABI (abi3-py38, see
  # Cargo.toml), which means a single wheel per OS/architecture works
  # across Python 3.8-3.12 -- there is no need to rebuild once per
  # Python version like a non-abi3 extension would.
  #
  # Linux wheels are built inside a manylinux_2_17 container via
  # maturin-action so the resulting .whl is manylinux-compliant
  # (avoids GLIBC_2.18+ symbol errors that occur when building
  # directly on ubuntu-latest).  Windows and macOS build normally.
  # Cargo.toml declares rust-version = "1.83" (rust_xlsxwriter 0.96 pulls
  # zip 7.2, whose own MSRV is 1.83). Nothing verified that claim, so a
  # dependency bump could silently raise the real MSRV. cargo check with a
  # pinned 1.83 toolchain fails loudly if that happens.
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: dtolnay/rust-toolchain@1.85.0
    - name: Check against declared MSRV
      run: cargo check --locked || cargo check

  build-wheels-linux:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Build manylinux wheel
      uses: PyO3/maturin-action@v1
      with:
        manylinux: manylinux_2_17
        args: --release --out dist
        rust-toolchain: stable

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-ubuntu-latest
        path: dist/*.whl

  build-wheels-non-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build wheel
      run: maturin build --release

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: target/wheels/*.whl

  build-sdist:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build sdist
      uses: PyO3/maturin-action@v1
      with:
        command: sdist
        args: --out dist
    - name: Upload sdist
      uses: actions/upload-artifact@v4
      with:
        name: wheels-sdist
        path: dist/*.tar.gz

  publish:
    needs: [lint, test, msrv, build-wheels-linux, build-wheels-non-linux, build-sdist]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Download all wheels
      uses: actions/download-artifact@v4
      with:
        pattern: wheels-*
        path: dist
        merge-multiple: true

    - name: Install twine
      run: pip install twine

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: twine upload dist/*.whl dist/*.tar.gz --skip-existing
