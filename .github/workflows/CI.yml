name: CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install dependencies
      run: |
        pip install maturin pytest

    - name: Build and install
      run: |
        maturin develop --release

    - name: Run tests
      run: |
        pytest tests/ -v

  # This crate builds against pyo3's stable ABI (abi3-py38, see
  # Cargo.toml), which means a single wheel per OS/architecture works
  # across Python 3.8-3.12 -- there is no need to rebuild once per
  # Python version like a non-abi3 extension would. The previous
  # version of this job matrixed over both `os` and `python-version`
  # (3 x 5 = 15 redundant builds producing 15 near-identical wheels);
  # matrixing on `os` alone cuts CI compute roughly 5x for the same
  # published artifacts.
  build-wheels:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Build wheel
      run: maturin build --release

    - name: Upload wheels
      uses: actions/upload-artifact@v4
      with:
        name: wheels-${{ matrix.os }}
        path: target/wheels/*.whl

  publish:
    needs: [test, build-wheels]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Set up Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Install maturin
      run: pip install maturin

    - name: Publish to PyPI
      env:
        MATURIN_PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
      run: maturin publish --skip-existing
