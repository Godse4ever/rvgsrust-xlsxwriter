[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "rvgsrust-xlsxwriter"
version = "0.2.28"
description = "A Rust-powered XLSX library for Python, with a Pythonic API and Polars/Pandas/PyArrow support. Built on rust_xlsxwriter."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.8"
authors = [
    {name = "RVGS Team", email = "rvgs@borderlessaccess.com"},
]
keywords = ["excel", "xlsx", "spreadsheet", "rust", "polars", "pandas", "fast"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Office/Business :: Financial :: Spreadsheet",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
pandas = ["pandas>=2.0", "pyarrow>=14.0"]
polars = ["polars>=1.0"]
all = ["pandas>=2.0", "polars>=1.0", "pyarrow>=14.0"]
dev = ["pytest>=8.0", "pytest-benchmark>=4.0", "black>=24.0", "ruff>=0.4", "openpyxl>=3.1", "pyarrow>=14.0"]

[project.urls]
Homepage = "https://github.com/Godse4ever/rvgsrust-xlsxwriter"
Documentation = "https://github.com/Godse4ever/rvgsrust-xlsxwriter#readme"
Repository = "https://github.com/Godse4ever/rvgsrust-xlsxwriter"
Issues = "https://github.com/Godse4ever/rvgsrust-xlsxwriter/issues"

[tool.maturin]
python-source = "python"
module-name = "rvgsrust_xlsxwriter._core"
manifest-path = "Cargo.toml"
compatibility = "manylinux_2_17"

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
